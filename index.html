<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Previous Year Problems Solution</title>
	
	<script async src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
	<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

	<script>
		window.MathJax = {
			tex: {
				inlineMath: [['$', '$'], ['\\(', '\\)']] // Allows both `$...$` and `\(...\)` inline rendering
			},
			svg: { fontCache: 'global' }
		};

		// Function to re-render MathJax equations after content update
		function renderMath() {
			if (window.MathJax) {
				MathJax.typesetPromise();
			}
		}
	</script>
	
	
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .content {
            display: flex;
            width: 80%;
            margin-top: 20px;
        }
        .left-container {
            width: 30%;
            max-height: 150vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .btn {
			display: block;
			width: 90%;
			padding: 8px;
			margin: 15px 0;
			font-size: 14px;
			font-weight: bold;
			border: none;
			cursor: pointer;
			transition: all 0.3s ease;
			
			/* Rounded corners */
			border-radius: 25px;

			/* 3D effect */
			box-shadow: 0px 5px 0px #b3b3b3, 0px 8px 15px rgba(0, 0, 0, 0.2);

			
			color: white;
		}

        .btn:nth-child(odd) {
            background-color: #2980b9;
            color: white;
        }
        .btn:nth-child(even) {
            background-color:  #52be80 ;
            color: white;
        }
        .btn:hover {
            transform: translateY(-3px);
			box-shadow: 0px 7px 0px #999, 0px 12px 20px rgba(0, 0, 0, 0.3);
        }
		.btn:active {
			transform: translateY(2px);
			box-shadow: 0px 3px 0px #777, 0px 6px 10px rgba(0, 0, 0, 0.2);
		}
        .right-container {
            width: 70%;
            max-height: 150vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-left: 10px;
        }
        .box {
            width: 80%;
            height: 130px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 10px;
			max-height: 130px;
        }
		.box1 {
			width: 80%;
			height: 80px;
			background-color:   #b3b6b7 ;
			border: 2px solid #ccc;
			border-radius: 10px;
			box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
			margin: 10px 0;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			padding: 10px;
			overflow-y: auto; /* Enables vertical scrolling */
			max-height: 200px; /* Adjust based on preference */
		}
		.box2 {
			width: 80%;
			height: 250px;
			background-color:   #fcf3cf ;
			border: 2px solid #ccc;
			border-radius: 10px;
			box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
			margin: 10px 0;
			flex-wrap: wrap;
			align-items: left;
			justify-content: left;
			padding: 10px;
			overflow-y: auto; /* Enables vertical scrolling */
			max-height: 250px; /* Adjust based on preference */
		}
		.box3 {
			width: 80%;
			height: 800px; /* Ensure fixed height */
			background-color: #fcf3cf;
			border: 2px solid #ccc;
			border-radius: 10px;
			box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
			margin: 10px 0;
			padding: 10px;
			overflow-y: auto; /* Enables vertical scrolling */
			max-height: 800px; /* Prevents exceeding set height */
			display: flex; /* Helps maintain structure */
			flex-direction: column;
		}
		
        .question-container {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 7px;
            justify-content: center;
        }

        .question-btn {
			padding: 8px 8px; /* Adjusted padding for better proportions */
			font-size: 12px; /* Slightly increased font size for readability */
			font-weight: bold;
			border: none;
			cursor: pointer;
	    	color: black;
			text-align: center;
			border-radius: 20px; /* Makes the button more rounded */
			box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); /* Adds a subtle shadow */
		}

		.question-btn:hover {
			background-color: #e0e0e0; /* Slightly darker shade on hover */
		}
        .question-btn:nth-child(odd) {
            background-color:  #85c1e9    ;
        }
        .question-btn:nth-child(even) {
            background-color:   #d4ac0d  ;
        }
		 #loadingModal {
		  display: none; /* Hidden by default */
		  position: fixed;
		  z-index: 9999;
		  left: 0;
		  top: 0;
		  width: 100%;
		  height: 100%;
		  overflow: hidden;
		  background-color: rgba(0, 0, 0, 0.6);
		}

		/* Modal content */
		.modal-content {
		  background-color: white;
		  margin: 20% auto;
		  padding: 20px;
		  border-radius: 10px;
		  width: 300px;
		  text-align: center;
		  font-family: Arial;
		  font-size: 18px;
		  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
		}

		/* Spinner */
		.spinner {
		  margin: 15px auto;
		  width: 40px;
		  height: 40px;
		  border: 5px solid #f3f3f3;
		  border-top: 5px solid #3498db;
		  border-radius: 50%;
		  animation: spin 1s linear infinite;
		}

		@keyframes spin {
		  0% { transform: rotate(0deg); }
		  100% { transform: rotate(360deg); }
		}

		#output {
		  padding: 20px;
		  font-family: monospace;
		  white-space: pre-wrap;
		}
    </style>
		<!-- Popup Modal -->
	  <div id="loadingModal">
		<div class="modal-content">
		  ⏳ Updating Question Database...
		  <div class="spinner"></div>
		</div>
	  </div>

	<div id="output"></div>
    
	<script>
	
	const url = "https://script.google.com/macros/s/AKfycbyeBUWWTasxUhsgku_-6szmXH2hAKwoBC4sJ2bNXvFfA53huTY6tPXgd2S2deD11A1oHg/exec";
    
	let questionDatabase = null;
    const modal = document.getElementById("loadingModal");

    modal.style.display = "block"; // Show loading spinner

    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return response.text();
      })
      .then(data => {
        const func = new Function(data + "\nreturn questionDatabase;");
        questionDatabase = func();
		
        if (questionDatabase) {
          console.log("✅ questionDatabase loaded successfully!");
		  
        } else {
          console.warn("⚠️ Data loaded but 'questionDatabase' not found.");
        }
      })
      .catch(error => {
        console.error("❌ Failed to load data:", error);
      })
      .finally(() => {
        modal.style.display = "none"; // Hide spinner
		handleButtonClick('Set Theory Relation and Function');
      });
	
	
	
	let previousClickedButton = null;

	function handleButtonClick(topic) {
		const box1 = document.getElementById("box1");
		let box2 = document.getElementById("box2");
		let box3 = document.getElementById("box3");
		
		// Remove the solutionButton if it exists
		if (box2 && box2.parentNode) {
			let solutionButton = box2.nextSibling;
			solutionButton.remove();
		}
		if (box3) { box3.remove();}
		if (box2) { box2.remove();}
		
		// button.style.backgroundColor = "gray"

		// Clear previous questions before adding new ones
		box1.innerHTML = `<div id="question-container" class="question-container"></div>`;
		
		let buttons = document.querySelectorAll('.btn');

			// Loop through all buttons to reset their colors
			buttons.forEach(button => {
				if (button.innerText === topic) {
					button.style.backgroundColor = '#165a2d'; // Set clicked button to gray
				} else {
					// Reset color based on even/odd position
					if ([...buttons].indexOf(button) % 2 === 0) {
						button.style.backgroundColor = '#2980b9'; // Even index color
					} else {
						button.style.backgroundColor = '#52be80'; // Odd index color
					}
				}
			});											
		
		generateQuestions(topic);
	}

	function generateQuestions(topic) {
		const questionContainer = document.getElementById("question-container");
		questionContainer.innerHTML = ''; // Clear previous questions

		const totalQuestions = questionDatabase[topic] ? questionDatabase[topic].length : 0;

		for (let i = 1; i <= totalQuestions; i++) {
			let btn = document.createElement("button");
			btn.className = "question-btn";
			btn.innerText = "Q" + i;
			btn.dataset.index = i; 

			// Handle button click
			btn.onclick = function () {
				if (previousClickedButton) {
					if (previousClickedButton.dataset.index % 2 === 0) {
						previousClickedButton.style.backgroundColor = "#d4ac0d"; // Even
					} else {
						previousClickedButton.style.backgroundColor = "#85c1e9"; // Odd
					}
				}

				this.style.backgroundColor = "gray";
				previousClickedButton = this;
				displayQuestionDetails(i, topic);
			};

			questionContainer.appendChild(btn);
		}
	}

	function Get_Selected_Question(questionNumber, chapterName) {
		const filteredQuestions = questionDatabase[chapterName];
		return (filteredQuestions && questionNumber <= filteredQuestions.length) ? filteredQuestions[questionNumber - 1] : null;
	}

	function displayQuestionDetails(questionNumber, chapterName) {
		let box2 = document.getElementById("box2");
		let box3 = document.getElementById("box3");
		


		// Remove the solutionButton if it exists
		if (box2 && box2.parentNode) {
			let solutionButton = box2.nextSibling;
			solutionButton.remove();
		}

		
		if (box3) {
			// If box3 already exists, hide it
			box3.remove();
			}
		if (!box2) {
			box2 = document.createElement("div");
			box2.id = "box2";
			box2.className = "box2";
			document.querySelector(".right-container").appendChild(box2);
		}

		const questionData = Get_Selected_Question(questionNumber, chapterName);

		if (!questionData) {
			box2.innerHTML = `<h3>No question found for Q${questionNumber} in ${chapterName}</h3>`;
			return;
		}

		// Ensure LaTeX content is processed correctly by MathJax
		box2.innerHTML = `
			<h3 style="margin: 5px 0; font-size: 14px;">
				${chapterName} - ${questionData.year} <br><br>
				Q${questionNumber}: ${questionData.q}<br> <br>
			</h3>
		`;
		const optionsGrid = document.createElement("div");
			optionsGrid.style.display = "grid";
			optionsGrid.style.gridTemplateColumns = "repeat(1, minmax(120px, 1fr))"; // Adjusts column width dynamically
			optionsGrid.style.columnGap = "20px"; // Increased horizontal gap for centering second column
			optionsGrid.style.rowGap = "10px"; // Reduced vertical spacing
			optionsGrid.style.marginTop = "0px"; // Removes unnecessary top margin
			optionsGrid.style.justifyContent = "center"; // Centers content horizontally

			questionData.options.forEach((option, index) => {
				const optionContainer = document.createElement("div");
				optionContainer.style.display = "flex"; // Aligns radio buttons and labels
				optionContainer.style.alignItems = "center";
				optionContainer.style.marginBottom = "2px"; // Reduced spacing between options

				const radioBtn = document.createElement("input");
				radioBtn.type = "radio";
				radioBtn.name = "question";
				radioBtn.value = index;
				radioBtn.id = "option" + index;
				radioBtn.style.marginRight = "8px"; // Space between radio button and label
				radioBtn.onclick = () => checkAnswer(index, questionData.correctAnswer);

				const label = document.createElement("label");
				label.htmlFor = "option" + index;
				label.innerHTML = `${option}`;

				optionContainer.appendChild(radioBtn);
				optionContainer.appendChild(label);

				optionsGrid.appendChild(optionContainer);
			});

		
		
		// Create the "Show Solution" button
		const solutionButton = document.createElement("button");
		solutionButton.innerText = "Show Solution";
		solutionButton.style.margin = "0 auto"; // Centers button horizontally
		solutionButton.style.padding = "10px 15px";
		solutionButton.style.fontSize = "14px";
		solutionButton.style.fontWeight = "bold";
		solutionButton.style.border = "none";
		solutionButton.style.borderRadius = "5px";
		solutionButton.style.cursor = "pointer";
		solutionButton.style.backgroundColor = "#ff5733"; // Vibrant color
		solutionButton.style.color = "white";
		solutionButton.style.width = "200px";
		solutionButton.style.textTransform = "uppercase";
		solutionButton.style.boxShadow = "2px 2px 5px rgba(0,0,0,0.2)"; // Light shadow
		solutionButton.onclick = () => showSolution(questionData); // Function to handle solution display

		// Append button to optionsGrid
		//optionsGrid.appendChild(solutionButton);
		box2.parentNode.insertBefore(solutionButton, box2.nextSibling);
		// Append the grid container to box2
		box2.appendChild(optionsGrid);
		



		// Feedback area
		const feedbackDiv = document.createElement("div");
		feedbackDiv.id = "feedback";
		box2.append(feedbackDiv);

		// Ensure MathJax reprocesses newly added content
		renderMath();
	}

	// Function to force MathJax to re-render LaTeX equations dynamically
	function renderMath() {
		if (window.MathJax) {
			MathJax.typesetPromise();
		}
	}



	function checkAnswer(selectedOption, correctAnswer) {
		const feedback = document.getElementById("feedback");
		if (!feedback) return;

		if (selectedOption === correctAnswer) {
			feedback.innerHTML = `<p style="color: green; font-weight: bold;">Correct! ✅</p>`;
		} else {
			feedback.innerHTML = `<p style="color: red; font-weight: bold;">Wrong ❌</p>`;
		}
	}
	function showSolution(questionData) {
		let box3 = document.getElementById("box3");

		// Find .box2
		let box2 = document.querySelector(".box2");

		// Remove the solutionButton if it exists
		if (box2 && box2.parentNode) {
			let solutionButton = box2.nextSibling;
			solutionButton.remove();
		}

		if (!box3) {
		setTimeout(() => {
				window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
			}, 0);
			// Create the .box3 element if it doesn't exist
			box3 = document.createElement("div");
			box3.id = "box3";
			box3.className = "box3";
			box3.style.height = "800px"; // Ensuring fixed height
			box3.style.display = "flex";
			box3.style.justifyContent = "center";
			box3.style.alignItems = "center";

			box3.innerHTML = `
			  <div id="iframe-loader" style="text-align:center; margin-top: 20px;">
				<div class="spinner"></div>
				<p>Loading solution...</p>
			  </div>
			  <iframe 
				src="${questionData.link}" 
				width="670" 
				height="800" 
				style="border: none; display: none;" 
				onload="this.style.display='block'; document.getElementById('iframe-loader').style.display='none';">
			  </iframe>
			`;
			
		

			// Insert .box3 immediately after .box2
			if (box2 && box2.parentNode) {
				box2.parentNode.insertBefore(box3, box2.nextSibling);
			}
		}
	}


</script>
</head>
<body>
    <h1>JEE Previous Year Problems Solution</h1>
    <div class="content">
        <div class="left-container">
            <button class="btn" onclick="handleButtonClick('Set Theory Relation and Function')">Set Theory Relation and Function</button>
            <button class="btn" onclick="handleButtonClick('Trigonometric Function')">Trigonometric Function</button>
            <button class="btn" onclick="handleButtonClick('Inverse Trigonometric Function')">Inverse Trigonometric Function</button>
            <button class="btn" onclick="handleButtonClick('Quadratic Equation and Logarithm')">Quadratic Equation and Logarithm</button>
            <button class="btn" onclick="handleButtonClick('Binomial Theorem')">Binomial Theorem</button>
            <button class="btn" onclick="handleButtonClick('Complex Number')">Complex Number</button>
            <button class="btn" onclick="handleButtonClick('Sequence and Series')">Sequence and Series</button>
            <button class="btn" onclick="handleButtonClick('Permutation Combination')">Permutation Combination</button>
            <button class="btn" onclick="handleButtonClick('Probability')">Probability</button>
            <button class="btn" onclick="handleButtonClick('Two Dimensional Geometry')">Two Dimensional Geometry</button>
            <button class="btn" onclick="handleButtonClick('Limit Continuity and Differentiability')">Limit Continuity and Differentiability</button>
            <button class="btn" onclick="handleButtonClick('Application of Derivatives')">Application of Derivatives</button>
            <button class="btn" onclick="handleButtonClick('Integral Calculus')">Integral Calculus</button>
            <button class="btn" onclick="handleButtonClick('Application of Integral')">Application of Integral</button>
            <button class="btn" onclick="handleButtonClick('Differential Equations')">Differential Equations</button>
            <button class="btn" onclick="handleButtonClick('Vector Algebra')">Vector Algebra</button>
            <button class="btn" onclick="handleButtonClick('Three Dimensional Geometry')">Three Dimensional Geometry</button>
            <button class="btn" onclick="handleButtonClick('Matrix and Determinant')">Matrix and Determinant</button>
        </div>
        <div class="right-container">
            <div class="box1" id="box1"></div>
			
        </div>
    </div>

</body>
</html>
